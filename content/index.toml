Bruggi è una ridente frazione del comune di Fabbrica Curone, situata a 1100 metri di altitudine \
nell'estrema punta della provincia di Alessandria, dove si incontrano Emilia, Liguria e Lombardia. \
Immersa in una verde gola circondata dai monti Ebro, Chiappo e Carmo, Bruggi è un luogo ricco di \
storia e tradizioni contadine, dove l'aria è diversa e i colori sono intensi."""
