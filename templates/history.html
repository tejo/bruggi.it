{% extends "base.html" %}

{% block content %}
<div class="relative w-full h-[400px] flex items-center justify-center bg-cover bg-center"
    style="background-image: linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(0,0,0,0.6)), url('{{ hero_image }}');">
    <div class="text-center px-4 animate-fade-in-up">
        <h1 class="text-white text-4xl md:text-6xl font-black drop-shadow-lg mb-2">{{ page_data.Title }}</h1>
        <p class="text-white text-lg md:text-xl font-medium opacity-90">{{ page_data.Subtitle }}</p>
    </div>
</div>

<div class="max-w-4xl mx-auto px-4 py-12 md:py-20">
    <div class="flex flex-col gap-6">
        {% for item in page_data.Items %}
        <details class="group bg-white dark:bg-[#1a2e1a] rounded-2xl border border-gray-200 dark:border-gray-800 shadow-sm overflow-hidden transition-all duration-300 open:shadow-md">
            <summary class="flex items-center justify-between p-6 cursor-pointer list-none select-none bg-gray-50 dark:bg-[#0c1a0c] hover:bg-gray-100 dark:hover:bg-[#112211] transition-colors">
                <div class="flex flex-col gap-1">
                    <h3 class="text-xl font-bold text-[#111811] dark:text-white group-hover:text-primary transition-colors">{{ item.Title }}</h3>
                    <span class="text-xs font-mono text-gray-500 dark:text-gray-400 uppercase tracking-wider flex items-center gap-1">
                        <span class="material-symbols-outlined text-[14px]">schedule</span> {{ item.ReadingTime }}
                    </span>
                </div>
                <span class="material-symbols-outlined text-2xl text-gray-400 group-open:rotate-180 transition-transform duration-300">expand_more</span>
            </summary>
            <div class="p-6 md:p-8 text-gray-700 dark:text-gray-300 leading-relaxed space-y-4 border-t border-gray-100 dark:border-gray-800 animate-fade-in prose dark:prose-invert max-w-none">
                {{ item.Content|linebreaks|safe }}
            </div>
        </details>
        {% endfor %}
    </div>

    <div class="mt-12 flex justify-center">
        <a href="{{ base_url }}/" class="flex items-center gap-2 px-6 py-3 rounded-lg bg-primary text-[#111811] font-bold hover:bg-green-500 transition-colors shadow-lg hover:shadow-xl hover:-translate-y-0.5 transform duration-200">
            <span class="material-symbols-outlined">arrow_back</span>
            {{ page_data.BackHome }}
        </a>
    </div>
</div>
{% endblock %}
