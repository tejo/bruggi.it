{% extends "base.html" %}

{% block content %}
<section class="py-16 px-4 md:px-40 bg-background-light dark:bg-background-dark">
    <div class="max-w-[960px] mx-auto flex flex-col gap-8">
        <div class="text-center md:text-left">
            <h1 class="text-[#111811] dark:text-white text-4xl font-bold leading-tight tracking-tight">{{ t.Sections.GalleryTitle }}</h1>
            <p class="text-gray-500 dark:text-gray-400 mt-2 text-xl">{{ t.Sections.GallerySubtitle }}</p>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            {% for g in galleries %}
            <a href="{{ base_url }}/galleries/{{ g.Slug }}.html" class="block group">
                <div class="rounded-2xl overflow-hidden aspect-video relative shadow-md transition-all duration-300 group-hover:shadow-xl group-hover:-translate-y-1">
                    <div class="absolute inset-0 bg-cover bg-center transition-transform duration-700 group-hover:scale-105"
                         style="background-image: url('{{ g.CoverImage }}');">
                    </div>
                    <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent opacity-80 group-hover:opacity-90 transition-opacity"></div>
                    
                    <div class="absolute bottom-0 left-0 p-6 w-full">
                        <h3 class="text-white text-2xl font-bold mb-2 group-hover:text-primary transition-colors">{{ g.Title }}</h3>
                        <p class="text-white/80 line-clamp-2">{{ g.Description }}</p>
                    </div>
                </div>
            </a>
            {% endfor %}
        </div>
    </div>
</section>
{% endblock %}
